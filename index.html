<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>KN-BEAUTY</title>
        <link rel="icon" type="image/png" href="img/favicon.png">
        <meta name="description" content="Découvrez notre boutique en ligne KN-BEAUTY." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="base.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <div class="Header">
            <a href="/" class="LogoWrapper">
                <img src="img/logo.png" alt="Logo KN" />
            </a>
            <h1 class="Name">KN-BEAUTY</h1>
        </div>

        <div class="IntroWrapper">
            <h2 class="WelcomeText">
              Bienvenue dans notre boutique en ligne
            </h2>
            <h3 class="SuggText">Suggestion</h3>
        </div>

        <div class="product-grid">
          <!-- Carte Produit 1 -->
          <div class="product-card">
            <img src="photo-produit-1.jpg" alt="Nom du produit 1">
            <h3>Produit 1</h3>
            <p class="price">25,00 €</p>
            <button>Acheter</button>
          </div>

          <!-- Carte Produit 2 -->
          <div class="product-card">
            <img src="photo-produit-2.jpg" alt="Nom du produit 2">
            <h3>Produit 2</h3>
            <p class="price">30,00 €</p>
            <button>Acheter</button>
          </div>
        </div>
    </body>
</html>

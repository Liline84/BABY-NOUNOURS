<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panier | KN-BEAUTY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <header class="home-header" id="home-header">
      <a class="header-logo" id="header-logo" href="index.html">
        <img src="img/logo.png" alt="Logo KN-BEAUTY" />
        <h1 class="header-h1">KN-BEAUTY</h1>
      </a>
      <div class="header-actions">
        <a class="header-cart" href="cart.html" aria-label="Panier">Panier <span class="cart-count" hidden>0</span></a>
        <a class="header-account" href="login.html">Connexion</a>
      </div>
    </header>

    <main class="page">
      <h2 class="page-title">Votre panier</h2>

      <div class="cart-empty" id="cart-empty" hidden>
        <p>Votre panier est vide.</p>
        <a class="btn" href="products.html">Voir les produits</a>
      </div>

      <div class="cart-layout" id="cart-layout" hidden>
        <ul class="cart-list" id="cart-list"></ul>

        <aside class="cart-summary">
          <h3>Récapitulatif</h3>
          <p class="cart-total"><span>Total</span> <strong id="cart-total"></strong></p>
          <button class="btn" id="order" type="button">Commander</button>
          <p class="order-note" id="order-note" role="status"></p>
        </aside>
      </div>
    </main>

    <script src="shop.js"></script>
    <script src="cart.js"></script>
    <script src="cart-page.js"></script>
  </body>
</html>
